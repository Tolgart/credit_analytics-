{% extends 'base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
    <h2>Вы уверены, что хотите удалить клиента {{ client.name }}?</h2>
    
    <form method="post" class="form-control">
        {% csrf_token %}
        <button type="submit" class="btn btn-dark" role="button">Удалить</button>
        <a href="{% url 'client_list' %}" class="btn btn-primary btn-light">Вернуться к списку клиентов</a>
    </form> 

{% endblock %}
